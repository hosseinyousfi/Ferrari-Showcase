services:
    nginx:
        container_name: nginx
        image: nginx:latest
        ports:
            - "80:80"
        volumes:
            - static_volume:/home/app/staticfiles/
            - media_volume://home/app/media/
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - backend

    db:
        container_name: db
        image: postgres:13-alpine
        volumes:
            - ./data:/var/lib/postgresql/data
            - pg_data_volume:/var/lib/postgresql/data
        env_file:
            - ./envs/.env
        ports:
            - "5432:5432"
        restart: always

    backend:
        build: ./
        container_name: backend
        #ports:
            #- "8000:8000"
        env_file:
            - ./envs/.env
        volumes:
            - ./:/app
            - static_volume:/app/staticfiles
            - media_volume:/app/media
        command: sh -c "python manage.py makemigrations --noinput && python manage.py migrate && gunicorn capstone.wsgi:application --bind 0.0.0.0:8000"
        restart: always
        depends_on:
            - db

volumes:
    static_volume:
    media_volume:
    pg_data_volume: